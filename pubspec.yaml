name: hisab
description: "Hisab: a calm offline expense tracker in Taka"
publish_to: 'none'

# The release workflow overrides the name (from the git tag) but NOT the +N build number.
# Raise +N with every build installed on a phone: Android refuses to go to a lower number.
version: 0.2.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  app_settings: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

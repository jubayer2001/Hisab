name: hisab
description: "Hisab: a calm offline expense tracker in Taka"
publish_to: 'none'

# The release workflow overrides the name (from the git tag) but NOT the +N build number.
# Raise +N with every build installed on a phone: Android refuses to go to a lower number.
version: 1.0.0+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  app_settings: ^9.0.1
  file_picker: ^13.1.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  sqlite3: ^3.7.1
  path: ^1.9.1
  local_auth: ^3.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

# The database is encrypted on disk. This picks the build of SQLite that supports it
# (SQLite3 Multiple Ciphers); the app's own key handling is in lib/data/db/database_security.dart.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

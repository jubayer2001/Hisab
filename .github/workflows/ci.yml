name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only: these checks never need to change anything in the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to an exact commit, so a changed or hijacked tag cannot slip
      # different code into the build. Dependabot (see dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      # --enforce-lockfile: build with exactly the dependency versions in pubspec.lock.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

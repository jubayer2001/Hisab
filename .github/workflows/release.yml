name: Release APK

# Runs when a version tag like v0.1.0 is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          # The build number (Android versionCode) comes from pubspec.yaml (the +N part), so it
          # always matches or exceeds the test builds installed over USB. Never let it go down.
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name="$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk Hisab.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hisab ${{ github.ref_name }}
          files: Hisab.apk
          # Not marked as pre-release, so /releases/latest/download/Hisab.apk always works.
          make_latest: true
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties

name: Release APK

# Runs when a version tag like v1.0.0 is pushed.
on:
  push:
    tags: ['v*']

# The only permission this workflow gets: attach the APK to the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to an exact commit, so a changed or hijacked tag cannot slip
      # different code into a signed build. Dependabot (see dependabot.yml) proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # --enforce-lockfile: build with exactly the dependency versions in pubspec.lock.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          # The build number (Android versionCode) comes from pubspec.yaml (the +N part), so it
          # always matches or exceeds the test builds installed over USB. Never let it go down.
          # --obfuscate scrambles the names inside the app, which makes it harder to pick apart.
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name="$VERSION" \
            --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk Hisab.apk

      - name: Fingerprint the APK
        run: |
          # Anyone can compare this against the file they downloaded to be sure it is untouched.
          sha256sum Hisab.apk | tee Hisab.apk.sha256
          {
            echo "### Verify your download"
            echo
            echo "SHA-256 of Hisab.apk:"
            echo
            echo '```'
            cut -d' ' -f1 Hisab.apk.sha256
            echo '```'
          } > checksum-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Hisab ${{ github.ref_name }}
          files: |
            Hisab.apk
            Hisab.apk.sha256
          body_path: checksum-notes.md
          # Not marked as pre-release, so /releases/latest/download/Hisab.apk always works.
          make_latest: true
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties
